<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIPLY - Silence Speaks Louder</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"></script>
</head>
<body>

<div id="loading">
  <img src="images/Ai.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/4712/4712027.png'">
  <h2>LIPLY</h2>
  <p>Loading...</p>
</div>

<div id="landing">
  <span class="badge">✨ AI LIP READING</span>
  <h1>LIPLY</h1>
  <p>Silence Speaks Louder - Lip Movement Se Samjho</p>
  <div class="btns">
    <button id="uploadBtn">📁 Upload Video</button>
    <button id="liveBtn">🎥 Live Camera</button>
  </div>
  <img src="images/Ai.png" class="main-img" onerror="this.style.display='none'">
  <input type="file" id="fileInput" accept="video/*" hidden>
</div>

<div id="app">
  <button id="backBtn">← Back</button>
  <h2>🎥 Lips Tracking ON - Mic OFF</h2>
  <p style="font-size:12px; color:#64748b; margin-bottom:10px;">Sirf muh ka movement track ho raha hai, voice record nahi ho rahi</p>
  <div style="position:relative; width:68%; max-width:620px;">
    <video id="previewVideo" autoplay muted playsinline></video>
    <canvas id="overlay" style="position:absolute; top:0; left:0; width:100%; height:100%; border-radius:18px;"></canvas>
  </div>
  <img id="imgPreview" style="display:none;">
  <div id="output">Ready - Go Live Dabao</div>
  <div class="record-area">
    <button id="recStart">🔴 Start Lip Recording</button>
    <button id="recStop">⏹️ Stop & See Result</button>
    <button id="analyzeUploadBtn" style="display:none;background:#2563eb;color:white;padding:10px 18px;border:none;border-radius:9px;cursor:pointer;font-weight:700">🔍 Analyze Uploaded Video Lips</button>
    <div id="timer">0 sec</div>
    <a id="dl" href="#" download>📥 Download Video</a>
  </div>
  <div id="dropZone">Ya yahan video drag & drop karo</div>
</div>

<script src="script.js"></script>
</body>
</html>
