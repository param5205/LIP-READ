<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIPLY - Silence Speaks Louder</title>
<link rel="stylesheet" href="style.css">
<style>
/* Emergency fallback if style.css fails */
#loading{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#fff;z-index:9999}
#landing{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
#app{display:none;flex-direction:column;align-items:center;gap:16px;padding:20px;min-height:100vh}
.video-wrapper{position:relative;width:100%;max-width:640px;aspect-ratio:4/3;background:#111;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
#previewVideo{width:100%;height:100%;object-fit:contain;background:#111;border-radius:12px;display:block}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;border-radius:12px}
.btn{padding:10px 20px;border-radius:8px;border:none;background:#2563eb;color:#fff;cursor:pointer;font-weight:600;margin:4px}
.btn:disabled{opacity:0.5}
#output{font-weight:600;text-align:center;min-height:24px}
</style>
</head>
<body>

<!-- Loading Screen -->
<div id="loading">
  <div style="font-size:60px;">🤖</div>
  <div style="margin-top:12px;font-weight:800;letter-spacing:2px;color:#1e3a8a;">LIPLY</div>
  <div style="font-size:12px;color:#666;">Loading...</div>
</div>

<!-- Landing Page -->
<div id="landing">
  <div style="font-size:72px;">🤖</div>
  <h1 style="margin:8px 0;">LIPLY</h1>
  <p style="color:#555;margin-bottom:24px;">Silence Speaks Louder - Automated Lip Reading System</p>
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
    <button class="btn" id="uploadBtn">📁 Upload Video</button>
    <button class="btn" id="liveBtn" style="background:#10b981;">🔴 Live Camera</button>
  </div>
  <div id="dropZone" style="margin-top:24px;border:2px dashed #2563eb;padding:20px;border-radius:12px;color:#2563eb;cursor:pointer;">
    Drag & drop a video here or click to select
  </div>
  <input type="file" id="fileInput" accept="video/mp4,video/webm,video/avi,video/mov,.mp4,.webm,.avi,.mov" style="display:none;">
</div>

<!-- App Page -->
<div id="app">
  <button class="btn" id="backBtn" style="background:#6b7280;align-self:flex-start;">← Back</button>
  
  <div class="video-wrapper">
    <video id="previewVideo" autoplay muted playsinline></video>
    <img id="imgPreview" style="display:none;max-width:100%;border-radius:12px;">
    <canvas id="overlay"></canvas>
  </div>

  <div id="output">Ready</div>
  <div id="timer" style="font-weight:600;color:#555;"></div>

  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
    <button class="btn" id="recStart" style="display:none;background:#ef4444;">Start Recording</button>
    <button class="btn" id="recStop" style="display:none;background:#000;">Stop Recording</button>
    <button class="btn" id="analyzeUploadBtn" style="display:none;">Analyze Uploaded Video</button>
  </div>
</div>

<!-- Emergency loading hide -->
<script>
  window.addEventListener('load', () => {
    setTimeout(() => {
      const ld = document.getElementById('loading');
      const land = document.getElementById('landing');
      if (ld && ld.style.display !== 'none') {
        ld.style.display = 'none';
        if (land) land.style.display = 'flex';
        console.log('Emergency hide loading triggered');
      }
    }, 2000);
  });
</script>

<!-- MediaPipe Libraries (Required for lip tracking) -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<!-- Your fixed script -->
<script src="script.js"></script>

</body>
</html>
