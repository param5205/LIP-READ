<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIPLY - Result & Translation</title>
<link rel="stylesheet" href="result.css">
</head>
<body>

<div class="topbar">
<button onclick="location.href='index.html'">← Back to LIPLY</button>

</div>

<div class="card">
<div class="videoBox">

</div>

<div class="resultBox">

</div>

</div>
</div>

<script src="result.js"></script>
